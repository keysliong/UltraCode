name: Build APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Bundle proot + Alpine Linux (embedded Claude Code)
        run: |
          set -euo pipefail
          sudo apt-get install -y -q patchelf >/dev/null
          J=app/src/main/jniLibs/arm64-v8a
          mkdir -p "$J" app/src/main/assets
          BASE=https://packages.termux.dev/apt/termux-main
          curl -fsSL "$BASE/dists/stable/main/binary-aarch64/Packages" -o Packages
          get() { awk -v p="$1" '$1=="Package:"{f=($2==p)} f&&$1=="Filename:"{print $2; exit}' Packages; }
          awk '$1=="Package:"&&$2=="proot"{f=1} f&&/^Depends:/{print; exit}' Packages
          for p in proot libtalloc libandroid-shmem; do
            curl -fsSL "$BASE/$(get $p)" -o "$p.deb"
            mkdir -p "x_$p" && dpkg-deb -x "$p.deb" "x_$p"
          done
          U=data/data/com.termux/files/usr
          cp "x_proot/$U/bin/proot" "$J/libproot.so"
          cp "x_proot/$U/libexec/proot/loader" "$J/libproot-loader.so"
          cp -L "x_libtalloc/$U/lib/libtalloc.so.2" "$J/libtalloc.so"
          patchelf --replace-needed libtalloc.so.2 libtalloc.so "$J/libproot.so"
          patchelf --remove-rpath "$J/libproot.so" || true
          patchelf --set-soname libtalloc.so "$J/libtalloc.so"
          cp -L "x_libandroid-shmem/$U/lib/libandroid-shmem.so" "$J/libandroid-shmem.so"
          patchelf --remove-rpath "$J/libandroid-shmem.so" || true
          for f in "$J"/*.so; do echo "== $f"; readelf -d "$f" | grep -E 'NEEDED|RUNPATH|SONAME' || true; done
          readelf -d "$J/libproot.so" | grep -E 'NEEDED|RUNPATH' || true
          curl -fsSL https://dl-cdn.alpinelinux.org/alpine/v3.20/releases/aarch64/alpine-minirootfs-3.20.3-aarch64.tar.gz \
            -o app/src/main/assets/alpine-minirootfs.tar.gz
          ls -la "$J" app/src/main/assets

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk UltraCode.apk

      - uses: actions/upload-artifact@v4
        with:
          name: UltraCode-apk
          path: UltraCode.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: UltraCode 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: |
            Сборка UltraCode из ветки `${{ github.ref_name }}`.
            Скачай **UltraCode.apk** ниже и установи на телефон.
          files: UltraCode.apk
