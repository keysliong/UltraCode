name: Update site (GitHub Pages)

# Pages is set to "Deploy from branch" (root). Pushes made by apps don't start a Pages build,
# so this workflow requests one explicitly whenever the site changes.
on:
  push:
    branches: [ccr-1ee23877-cc5vrz]
    paths:
      - 'index.html'
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  request-build:
    runs-on: ubuntu-latest
    steps:
      - name: Request a GitHub Pages build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds"
          echo
          sleep 45
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds/latest"
