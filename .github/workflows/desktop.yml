name: Build desktop

on:
  push:
    branches: ['**']
    paths:
      - 'desktop/**'
      - 'app/src/main/java/com/ultracode/app/ai/**'
      - 'app/src/main/java/com/ultracode/app/agent/**'
      - 'app/src/main/java/com/ultracode/app/github/**'
      - 'app/src/main/java/com/ultracode/app/data/**'
      - 'app/src/main/java/com/ultracode/app/ui/Cookie.kt'
      - 'app/src/main/java/com/ultracode/app/ui/Markdown.kt'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Package installer
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :desktop:packageDistributionForCurrentOS --no-daemon

      - name: Collect files
        shell: bash
        run: |
          mkdir -p out
          find desktop/build/compose/binaries -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.dmg' -o -name '*.deb' \) -exec cp {} out/ \;
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: UltraCode-desktop-${{ matrix.os }}
          path: out/*

  release:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-${{ github.run_number }}
          name: UltraCode для компьютера 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: |
            UltraCode для компьютера.
            - **Windows**: `UltraCode-*.exe` или `UltraCode-*.msi`
            - **macOS**: `UltraCode-*.dmg` (при первом запуске: правый клик → «Открыть»)
            - **Linux (Ubuntu/Debian)**: `ultracode_*.deb`
          files: dist/*
