name: Build desktop

on:
  push:
    branches: ['**']
    paths:
      - 'desktop/**'
      - 'app/src/main/java/com/ultracode/app/ai/**'
      - 'app/src/main/java/com/ultracode/app/agent/**'
      - 'app/src/main/java/com/ultracode/app/github/**'
      - 'app/src/main/java/com/ultracode/app/data/**'
      - 'app/src/main/java/com/ultracode/app/ui/Cookie.kt'
      - 'app/src/main/java/com/ultracode/app/ui/Markdown.kt'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Package installer
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :desktop:packageDistributionForCurrentOS --no-daemon || {
            echo "---- jpackage logs ----"
            find desktop/build/compose/logs -type f -exec sh -c 'echo "== $1"; cat "$1"' _ {} \;
            exit 1
          }

      - name: Windows installer (Inno Setup, Material You style)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./gradlew :desktop:createDistributable --no-daemon
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVer=1.0.${{ github.run_number }}" desktop\installer\UltraCode.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Collect files
        shell: bash
        run: |
          mkdir -p out
          find desktop/build/compose/binaries -type f \( -name '*.msi' -o -name '*.dmg' -o -name '*.deb' \) -exec cp {} out/ \;
          if [ -d desktop/build/installer ]; then cp desktop/build/installer/*.exe out/; fi
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: UltraCode-desktop-${{ matrix.os }}
          path: out/*

  release:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-${{ github.run_number }}
          name: UltraCode для компьютера 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: |
            UltraCode для компьютера.
            - **Windows**: `UltraCode-Setup-*.exe` (установщик) или `UltraCode-*.msi`
            - **macOS**: `UltraCode-*.dmg` (при первом запуске: правый клик → «Открыть»)
            - **Linux (Ubuntu/Debian)**: `ultracode_*.deb`
          files: dist/*
          make_latest: false

      - name: Stable file names
        run: |
          mkdir -p stable
          cp dist/UltraCode-Setup-*.exe stable/UltraCode-Setup.exe
          cp dist/UltraCode-*.msi stable/UltraCode.msi
          cp dist/UltraCode-*.dmg stable/UltraCode.dmg
          cp dist/ultracode_*.deb stable/UltraCode.deb
          ls -la stable

      - name: Stable download links (desktop-latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-latest
          name: UltraCode для компьютера (последняя версия)
          make_latest: false
          body: Всегда последняя сборка UltraCode для Windows, macOS и Linux.
          files: stable/*
